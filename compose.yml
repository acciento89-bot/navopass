services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: navopass
      POSTGRES_USER: navopass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - navopass-db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navopass -d navopass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://navopass:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}@db:5432/navopass
      APP_URL: ${APP_URL:-https://navopass.de}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - navopass-uploads:/app/uploads
    expose:
      - "3000"
    networks:
      backend:
      kamilunavo_frontend:
        aliases:
          - navopass

volumes:
  navopass-db:
  navopass-uploads:

networks:
  backend:
    driver: bridge
  kamilunavo_frontend:
    external: true
    name: kamilunavo-infrastructure_frontend
