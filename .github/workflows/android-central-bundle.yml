name: Android central-signed bundle
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-central-bundle.yml
permissions:
  contents: read
concurrency:
  group: android-central-bundle
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/navopass'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      APP_ID: navopass
      PACKAGE_NAME: de.kamilunavo.navopass
      EXPECTED_VERSION_CODE: '10'
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - name: Install Android 16 SDK
      run: |-
        sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.5.0
    - name: Set release version in this build only
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        p = Path('android/app/build.gradle.kts')
        s = p.read_text()
        old = 'versionCode = 9'
        assert s.count(old) == 1, 'Unexpected source version; re-audit before building'
        p.write_text(s.replace(old, 'versionCode = 10'))
        PY
    - name: Verify exact iOS, Android launcher and splash icon identity
      shell: bash
      run: |
        set -euo pipefail
        ios_icon='ios/NavoPass/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
        android_icon='android/app/src/main/res/drawable-nodpi/navopass_icon.png'
        test -s "$ios_icon"
        test -s "$android_icon"
        cmp -s "$ios_icon" "$android_icon"
        grep -Fq 'android:icon="@drawable/navopass_icon"' android/app/src/main/AndroidManifest.xml
        ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
        grep -Fq '@drawable/navopass_icon' android/app/src/main/res/values-v31/themes.xml
        test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        test ! -e android/app/src/main/res/drawable/ic_launcher.xml
        test ! -e android/app/src/main/res/drawable/navopass_launcher_background.xml
        test ! -e android/app/src/main/res/drawable/navopass_launcher_foreground.xml
        sha256sum "$ios_icon" "$android_icon"
    - name: Unit tests
      run: |-
        gradle -p android testDebugUnitTest --stacktrace
    - name: Build release AAB
      run: |-
        gradle -p android bundleRelease --stacktrace
    - name: Verify native parity and Play release identity
      shell: bash
      run: |
        set -euo pipefail
        test -f android/app/build/outputs/bundle/release/app-release.aab
        grep -Fq 'applicationId = "de.kamilunavo.navopass"' android/app/build.gradle.kts
        grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
        grep -Fq 'versionCode = 10' android/app/build.gradle.kts
        grep -Fq 'versionName = "1.0.4"' android/app/build.gradle.kts
        grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
        grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
        grep -Fq 'android:name="com.google.mlkit.vision.DEPENDENCIES"' android/app/src/main/AndroidManifest.xml
        grep -Fq 'android:value="barcode_ui"' android/app/src/main/AndroidManifest.xml
        grep -Fq 'class MainActivity : ComponentActivity()' android/app/src/main/java/de/kamilunavo/navopass/MainActivity.kt
        grep -Fq 'runCatching { GmsBarcodeScanning.getClient(context, options) }' android/app/src/main/java/de/kamilunavo/navopass/MainActivity.kt
        grep -Fq '/api/mobile/assets' android/app/src/main/java/de/kamilunavo/navopass/ApiClient.kt
        grep -Fq 'deleteAccount' android/app/src/main/java/de/kamilunavo/navopass/ApiClient.kt
        if grep -RFn --include='*.kt' -e 'AndroidView(' -e 'WebView(' android/app/src/main/java; then
          echo 'WebView wrapper found: NavoPass Android must remain fully native.' >&2
          exit 1
        fi
    - name: Stage bundle for isolated signing
      run: |-
        set -euo pipefail
        AAB="android/app/build/outputs/bundle/release/app-release.aab"
        test -s "$AAB"
        mkdir -p unsigned
        cp "$AAB" unsigned/app.aab
        printf '%s\n' "$GITHUB_SHA" > unsigned/source-commit.txt
    - uses: actions/upload-artifact@v4
      with:
        name: central-input-navopass-${{ github.run_id }}
        path: unsigned/
        if-no-files-found: error
        retention-days: 1
  sign:
    if: github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/navopass'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APP_ID: navopass
      PACKAGE_NAME: de.kamilunavo.navopass
      EXPECTED_VERSION_CODE: '10'
    steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: central-input-navopass-${{ github.run_id }}
        path: input
    - name: Validate bundle identity before restoring signing material
      run: |-
        set -euo pipefail
        test "$(cat input/source-commit.txt)" = "$GITHUB_SHA"
        test -s input/app.aab
        curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
        java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=input/app.aab
        package=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@package')
        code=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@android:versionCode')
        test "$package" = "$PACKAGE_NAME"
        test "$code" = "$EXPECTED_VERSION_CODE"
        mkdir -p signed
        python3 - <<'PY'
        import zipfile
        with zipfile.ZipFile('input/app.aab') as src, zipfile.ZipFile('signed/app.aab','w') as out:
            names=src.namelist()
            assert len(names)==len(set(names)), 'Duplicate ZIP entries'
            for item in src.infolist():
                upper=item.filename.upper()
                leaf=upper.removeprefix('META-INF/')
                if upper.startswith('META-INF/') and '/' not in leaf and (leaf=='MANIFEST.MF' or leaf.endswith(('.SF','.RSA','.DSA','.EC')) or leaf.startswith('SIG-')):
                    continue
                out.writestr(item,src.read(item))
        PY
    - name: Restore verified central upload identity
      uses: acciento89-bot/maengelfix/.github/actions/restore-central-android-signing@main
    - name: Sign and independently verify central release bundle
      run: |-
        set -euo pipefail
        expected='BCF2337D41E617C03BCAE698C09D1523654BD790'
        test "$KAMILUNAVO_CENTRAL_UPLOAD_SHA1" = "$expected"
        jarsigner -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storetype PKCS12 -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 signed/app.aab "$ANDROID_UPLOAD_KEY_ALIAS"
        jarsigner -verify signed/app.aab > "$RUNNER_TEMP/verification.txt"
        grep -Fq 'jar verified.' "$RUNNER_TEMP/verification.txt"
        keytool -J-Duser.language=en -printcert -jarfile signed/app.aab > "$RUNNER_TEMP/certificate.txt"
        actual=$(sed -n 's/^[[:space:]]*SHA1: //p' "$RUNNER_TEMP/certificate.txt" | tr -d ':\r\n ')
        test "$actual" = "$expected"
        java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=signed/app.aab
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@package')" = "$PACKAGE_NAME"
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@android:versionCode')" = "$EXPECTED_VERSION_CODE"
        filename="$APP_ID-v$EXPECTED_VERSION_CODE-central.aab"
        mv signed/app.aab "signed/$filename"
        (cd signed && sha256sum "$filename" > "$filename.sha256")
        jq -n --arg package "$PACKAGE_NAME" --argjson versionCode "$EXPECTED_VERSION_CODE" --arg certificateSha1 "$actual" --arg sourceCommit "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{package:$package,versionCode:$versionCode,certificateSha1:$certificateSha1,sourceCommit:$sourceCommit,runId:$runId}' > signed/release-evidence.json
        printf '%s versionCode %s central-signed and verified. No Play changes.\n' "$PACKAGE_NAME" "$EXPECTED_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
    - name: Destroy restored signing material
      if: always()
      run: |-
        rm -f "$RUNNER_TEMP/kamilunavo-central-upload.p12"
        rm -rf "$RUNNER_TEMP/kamilunavo-central-signing"
    - name: Preserve verified release bundle
      uses: actions/upload-artifact@v4
      with:
        name: navopass-v10-central-signed-aab
        path: signed/
        if-no-files-found: error
        retention-days: 30
