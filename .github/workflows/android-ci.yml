name: NavoPass Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
    paths:
      - 'android/**'
      - 'public/navopass.svg'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'public/navopass.svg'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify canonical app, launcher, splash and Play icon identity
        shell: bash
        run: |
          set -euo pipefail
          cmp -s public/navopass.svg android/store/google-play/icon.svg
          grep -Fq '#0A6D99' android/app/src/main/res/values/colors.xml
          grep -Fq '#0B4D70' android/app/src/main/res/values/colors.xml
          grep -Fq 'M256,103 L141,151' android/app/src/main/res/drawable/navopass_launcher_foreground.xml
          grep -Fq 'M204,254 L240,290 L312,212' android/app/src/main/res/drawable/navopass_launcher_foreground.xml
          grep -Fq '@mipmap/ic_launcher' android/app/src/main/res/values-v31/themes.xml
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug AAB
        run: gradle -p android bundleDebug --stacktrace
      - name: Build release AAB
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify native parity and Play release identity
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -Fq 'applicationId = "de.kamilunavo.navopass"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 9' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.4"' android/app/build.gradle.kts
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:name="com.google.mlkit.vision.DEPENDENCIES"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:value="barcode_ui"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'class MainActivity : ComponentActivity()' android/app/src/main/java/de/kamilunavo/navopass/MainActivity.kt
          grep -Fq 'runCatching { GmsBarcodeScanning.getClient(context, options) }' android/app/src/main/java/de/kamilunavo/navopass/MainActivity.kt
          grep -Fq '/api/mobile/assets' android/app/src/main/java/de/kamilunavo/navopass/ApiClient.kt
          grep -Fq 'deleteAccount' android/app/src/main/java/de/kamilunavo/navopass/ApiClient.kt
          if grep -RFn --include='*.kt' -e 'AndroidView(' -e 'WebView(' android/app/src/main/java; then
            echo 'WebView wrapper found: NavoPass Android must remain fully native.' >&2
            exit 1
          fi
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NavoPass-1.0.4-9-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
