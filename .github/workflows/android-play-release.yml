name: NavoPass Android Play Release

on:
  push:
    branches:
      - 'play-release/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-play-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate existing Play signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}'
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
      - name: Restore existing Play upload keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/navopass-upload.jks"
          chmod 600 "$RUNNER_TEMP/navopass-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/navopass-upload.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build signed release AAB
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify signed Play bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          OUT='android/app/build/outputs/bundle/release/NavoPass-1.0.3-8-PlayStore.aab'
          test -s "$AAB"
          grep -Fq 'applicationId = "de.kamilunavo.navopass"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 8' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.3"' android/app/build.gradle.kts
          grep -Fq 'android:value="barcode_ui"' android/app/src/main/AndroidManifest.xml
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.txt
          grep -Fq 'jar verified.' /tmp/jarsigner.txt
          cp "$AAB" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavoPass-1.0.3-8-PlayStore
          path: |
            android/app/build/outputs/bundle/release/NavoPass-1.0.3-8-PlayStore.aab
            android/app/build/outputs/bundle/release/NavoPass-1.0.3-8-PlayStore.aab.sha256
          if-no-files-found: error
          retention-days: 14
